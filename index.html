<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Kimchen</title>
    <link rel="stylesheet" href="style.css" />

  <body>
    <!-- inside the body you have your normal layout -->
    <button class="muteButton red" id="mutes" onclick="muted(this)">Muted</button>

    <div class="left-column">
      <div class="small-row center">
        <h1 class="white-font front" id="timer">150</h1>
      </div>
      <div class="small-row">

      </div>
      <div class="small-row">
        <img
          src="images/Cardboard_Boxes.png"
          class="cursor"
          onclick="showModal(this)"
          id="0"
        />
      </div>
      <div class="small-row">
        <img
          src="images/Cardboard_Boxes.png"
          class="cursor"
          onclick="showModal(this)"
          id="1"
        />
      </div>
      <div class="small-row">
        <img
          src="images/Cardboard_Boxes.png"
          class="cursor"
          onclick="showModal(this)"
          id="2"
        />
      </div>
    </div>
    <div class="left-column">
      <div class="small-row"></div>
      <div class="row center">
        <img src="images/Electric_Box.png" class="cursor contain-image" 
        onclick="showModal(this)"
        id="3"/>
      </div>
      <div class="small-row"></div>
    </div>

    <div class="left-column">
      <div class="small-row">
        <img src="images/Nothing.png" id="bigKey"/>
      </div>
      <div class="small-row"></div>
      <div class="small-row">
        <img id="6" class="contain-image cursor" src="images/Hint.png" onclick="showModal(this)"/>
      </div>
    </div>

    <div class="left-column">
      <div class="row"></div>
      <div class="small-row"></div>
      <div class="med-row center"></div>
    </div>

    <div class="right-column">
      <div class="row"></div>
      <div class="small-row">
        <img
        src="images/Nothing.png"
        class="contain-arrow uparrow clickable1"
        id="leave"
      />
      </div>
      <div class="small-row"></div>
      <div class="med-row center">
        <img class="max" src="images/Nothing.png"/>
      </div>
    </div>

    <div class="middle-column">
      <div class="small-row">
        <img

        class="contain-minimap moveminimap"
      />
      </div>
      <div class="small-row"></div>
      <div class="med-row center"></div>
    </div>

    <div class="right-column">
      <div class="small-row"></div>
      <div class="small-row"></div>
      <div class="small-row"></div>
      <div class="row center">
        <img src="images/Light_Switched.png" class="cursor contain-image" 
        onclick="lights()"/>
      </div>
    </div>

    <!-- Top Cardboard Box -->
    <div class="modal center" id="topBox">
      <span class="close" onclick="hideModal()">&times;</span>
      <div class="modal-body center">

        <div class="big-column grey">
          <div class="boxes blood center">
            <img class="cursor" src="images/CurvedWire.png" onclick="grabWires(this)" />
          </div>
          <div class="boxes grey center">
            <img class="cursor" src="images/CurvedWire.png" onclick="grabWires(this)" />
          </div>
          <div class="boxes blood center">
            <img class="cursor" src="images/StraightWire.png" onclick="grabWires(this)" />
          </div>
          <div class="small-box center">
            <h1 class="white-font" id="straightCount0">0</h1>
            <img id="straight0" class="cursor" src="images/StraightWire.png" onclick="wireCheck(this)"/>
          </div>
        </div>

        <div class="big-column blood">
          <div class="boxes grey center">
            <img class="cursor" src="images/StraightWire.png" onclick="grabWires(this)" />
          </div>
          <div class="boxes black center">
            <img class="cursor" src="images/StraightWire.png" onclick="grabWires(this)" />
          </div>
          <div class="boxes grey center">
            <img class="cursor" src="images/StraightWire.png" onclick="grabWires(this)"/>
          </div>
          <div class="small-box center">
            <h1 class="white-font" id="curveCount0">0</h1>
            <img id="curve0" class="cursor" src="images/CurvedWire.png" onclick="wireCheck(this)"/>

        </div>
        
      </div>
    </div>

    <!-- Middle Cardboard Box -->

      <span class="close" onclick="hideModal()">&times;</span>
      <div class="modal-body center">

<div class="big-column grey">

          </div>
          <div class="boxes grey center">
            <img class="cursor" src="images/CurvedWire.png" onclick="grabWires(this)" />
          </div>
          <div class="boxes blood center">
            <img class="cursor" src="images/CurvedWire.png" onclick="grabWires(this)" />

        </div>

        <div class="big-column blood">
          <div class="boxes grey center">
            <img class="cursor" src="images/CurvedWire.png" onclick="grabWires(this)" />
          </div>
          <div class="boxes black center">
            <img class="cursor" src="images/CurvedWire.png" onclick="grabWires(this)" />
          </div>
          <div class="boxes grey center">
            <img class="cursor" src="images/StraightWire.png" onclick="grabWires(this)"/>
          </div>
          <div class="small-box center">
            <h1 class="white-font" id="curveCount1">0</h1>
            <img id="curve1" class="cursor" src="images/CurvedWire.png" onclick="wireCheck(this)"/>

        </div>

      </div>
    </div>

    <!-- Bottom Cardboard Box -->
    <div class="modal center" id="botBox">
      <span class="close" onclick="hideModal()">&times;</span>
      <div class="modal-body center">

<div class="big-column grey">
          <div class="boxes blood center">

          </div>
          <div class="boxes grey center">

          </div>
          <div class="boxes blood center">
            <img class="cursor" src="images/CurvedWire.png" onclick="grabWires(this)" />

        </div>

        <div class="big-column blood">

            <img class="cursor" src="images/CurvedWire.png" onclick="grabWires(this)" />
          </div>
          <div class="half black center">
            <img class="cursor" src="images/StraightWire.png" onclick="grabWires(this)" />
          </div>
          <div class="small-box center">
            <h1 class="white-font" id="curveCount2">0</h1>
            <img id="curve2" class="cursor" src="images/CurvedWire.png" onclick="wireCheck(this)"/>
          </div>
        </div>
        
      </div>
    </div>
